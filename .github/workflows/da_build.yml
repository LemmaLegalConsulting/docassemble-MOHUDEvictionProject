name: Build and install docassemble

on:
  pull_request:

jobs:
  build-n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: SuffolkLITLab/ALActions/da_build@main
        env:
          UV_CONSTRAINT: ${{ github.workspace }}/requirements-ci-certifi.txt
        with:
          python-version: "3.12"
