name: Run isolated interview tests

on:
  push:
  workflow_dispatch:
    inputs:
      tags:
        description: Optional ALKiln tag expression
        default: ''

permissions:
  contents: read

jobs:
  interview-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Run interview tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ALKiln v4 uses retired upload-artifact v2. Pin v5 and use an isolated
      # server so Dependabot branches do not require repository secrets.
      - name: Start an isolated docassemble server
        id: server
        uses: SuffolkLITLab/ALKiln/action_for_github_server@24a5b5d3269179ee349be3a4266f7ced8cef6bfb
      - name: Use ALKiln to run tests
        uses: SuffolkLITLab/ALKiln@24a5b5d3269179ee349be3a4266f7ced8cef6bfb
        with:
          SERVER_URL: ${{ steps.server.outputs.SERVER_URL }}
          DOCASSEMBLE_DEVELOPER_API_KEY: ${{ steps.server.outputs.DOCASSEMBLE_DEVELOPER_API_KEY }}
          ALKILN_TAG_EXPRESSION: ${{ inputs.tags }}
